<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1220">
<title>Presenter Remote</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:#0b1220;color:#e8eefc;font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  body{display:flex;flex-direction:column;justify-content:center;gap:12px;padding:24px;padding-top:calc(24px + env(safe-area-inset-top));}
  h1{margin:0;font-size:26px;} p{margin:0;color:#8b9bbd;font-size:14px;}
  input{width:100%;padding:14px;border-radius:14px;border:1px solid #2a3858;background:#131c30;color:inherit;font:inherit;}
  button{min-height:56px;border-radius:14px;border:1px solid #2a3858;background:#1a2540;color:inherit;font:inherit;font-weight:700;}
  button.go{border-color:#ffc766;background:linear-gradient(#ffb02e,#e8780a);color:#2a1600;font-size:20px;min-height:64px;}
  button:disabled{opacity:.5;} #err{color:#ff8a96;font-size:14px;min-height:1.3em;}
</style>
</head>
<body>
  <h1>Presenter Remote</h1>
  <p>Open Presenter on the computer, tap <b>📱 Phone</b>, then scan the QR code here.</p>
  <button id="scan" type="button">📷 Scan QR code</button>
  <p>…or type the details:</p>
  <input id="host" placeholder="Computer address, e.g. 192.168.1.20" inputmode="url" autocapitalize="off" autocomplete="off" spellcheck="false">
  <input id="pin" placeholder="Connection PIN" autocapitalize="off" autocomplete="off" spellcheck="false">
  <label style="display:flex;gap:10px;align-items:center;color:#8b9bbd;font-size:13px;"><input id="builtin" type="checkbox" style="width:auto;"> Use the remote built into this app (needs the newer Presenter server)</label>
  <div id="err"></div>
  <button id="go" class="go" type="button">Connect</button>
<script src="main.js"></script>
</body>
</html>
